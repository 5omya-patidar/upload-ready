[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upload-ready"
version = "1.0.0rc2"
description = "Local-only desktop application for converting, resizing, compressing, and preparing images and PDFs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Upload Ready Contributors"}
]
dependencies = [
    "pillow==13.0.0",
    "pypdf==6.21.4",
    "pypdfium2==5.14.0",
    "pyside6-essentials==6.12.0",
    "shiboken6==6.12.0",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.4.0",
]

[project.scripts]
upload-ready = "upload_ready.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

